[package]
name = "assistant-core"
version = "0.1.0"
edition = "2021"

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
indexmap = { version = "2", features = ["serde"] }
async-trait = "0.1"
url = "2"
thiserror = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", features = ["process", "io-util", "time", "rt", "macros", "sync", "net"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4"] }
rmcp = { version = "=3.9.0", features = ["server", "macros", "transport-streamable-http-server", "schemars"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
subtle = "2"
http = "1"
futures-core = "0.3.34"
futures-util = "0.3.34"
bytes = "1.12.1"
which = "8.0.6"
tempfile = "3"
keyring = "4"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
wiremock = "0.6"
tempfile = "3"
rmcp = { version = "=3.9.0", features = ["client", "transport-streamable-http-client-reqwest"] }
